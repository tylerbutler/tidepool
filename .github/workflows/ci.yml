name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-button:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - name: Check the standalone SQLite-only template
        run: |
          node scripts/sync-sqlite-template.mjs --check
          cp -R sqlite-only "$RUNNER_TEMP/tidepool-sqlite"
          cd "$RUNNER_TEMP/tidepool-sqlite"
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Check the standalone token-service template
        run: |
          cp -R token-service "$RUNNER_TEMP/tidepool-token-service"
          cd "$RUNNER_TEMP/tidepool-token-service"
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - run: pnpm install --frozen-lockfile
      - name: Build without a preinstalled Gleam compiler
        run: |
          if command -v gleam >/dev/null 2>&1; then
            echo "This job must exercise the missing-compiler bootstrap"
            exit 1
          fi
          test ! -e protocol/build
          pnpm build
      - name: Check the core-only deployment bundle
        run: |
          pnpm run deploy --dry-run --outdir dist/button
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const source = readFileSync("dist/button/worker.js", "utf8");
          const exports = source.match(/export\s*\{[^}]*\}/g)?.join("\n") ?? "";
          for (const name of ["DocumentDO", "TidepoolConnector", "default"]) {
            assert.match(exports, new RegExp(`\\b${name}\\b`));
          }
          NODE
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # ratchet:erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm check && pnpm test
